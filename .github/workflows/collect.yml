name: Collect KDI RSS
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/collector.py
      - run: python scripts/score.py             # 관련도 점수·숨김·중복·정책 스레드
      - run: python scripts/extract_deadlines.py # 마감·시행 일정 추출
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add docs/data/archive.json docs/data/threads.json docs/data/deadlines.json
          git diff --cached --quiet || \
            git commit -m "data: update archive [skip ci]"
          git push
