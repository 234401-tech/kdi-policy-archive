name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 * * * *'   # 매시 20분 — collect(:05분) 직후 최신 데이터를 사이트에 반영
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages (미설정 시 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
